services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind123
      POSTGRES_DB: docmind
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind"]
      interval: 10s
      timeout: 5s
      retries: 5
  # api:
  #   build: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
volumes:
  pgdata:
